services:
  - type: web
    name: mental-health-score-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-deploy.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

  - type: web
    name: mental-health-score-ui
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-deploy.txt
    startCommand: streamlit run UserInterface.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: mental-health-score-api
          property: host
